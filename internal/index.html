<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Rally — Platform Command Center</title>
  <script>(function(){try{var t=localStorage.getItem('rally-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f6fa; --surface: #ffffff; --border: #e4e6ea;
      --navy: #000666; --gold: #FCD400; --accent: var(--navy);
      --text: #191c1e; --muted: #5a5c6b; --danger: #b3261e; --good: #1e7a34;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0a0b1a; --surface: #12132b; --border: #262842;
        --accent: #8b93ff; --text: #eef0fa; --muted: #9294b0;
        --danger: #ff6b6b; --good: #4ade80;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0a0b1a; --surface: #12132b; --border: #262842;
      --accent: #8b93ff; --text: #eef0fa; --muted: #9294b0;
      --danger: #ff6b6b; --good: #4ade80;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 24px;
    }
    .hidden { display: none !important; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; margin-bottom: 20px;
    }
    #login-view { max-width: 420px; margin: 80px auto; text-align: center; }
    #login-view h1 { font-size: 20px; font-weight: 800; margin-bottom: 24px; }
    #login-view input {
      display: block; width: 100%; padding: 12px 14px; margin-bottom: 12px;
      border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
      color: var(--text); font-size: 15px;
    }
    #login-view button, .refresh-btn {
      width: 100%; background: var(--navy); color: #fff; border: none;
      border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer;
      white-space: nowrap;
    }
    .refresh-btn { width: auto; padding: 12px 20px; }
    #login-error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
    #app-view { max-width: 1100px; margin: 0 auto; }
    .top-bar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .top-bar h1 { font-size: 22px; font-weight: 800; white-space: nowrap; }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .metric-group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }
    .metric { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .metric:last-child { border-bottom: none; }
    .metric .value { font-weight: 700; font-variant-numeric: tabular-nums; }
    .note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    tr.org-row { cursor: pointer; }
    tr.org-row:hover { background: var(--bg); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.active { background: rgba(30,122,52,.12); color: var(--good); }
    .badge.inactive { background: rgba(179,38,30,.1); color: var(--danger); }
    .back-link { color: var(--accent); cursor: pointer; font-size: 14px; margin-bottom: 16px; display: inline-block; }
  </style>
</head>
<body>

  <div id="login-view">
    <h1>Rally Platform Command Center</h1>
    <input id="login-email" type="email" placeholder="Email" autocomplete="username" />
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="login-btn">Sign in</button>
    <div id="login-error"></div>
  </div>

  <div id="app-view" class="hidden">
    <div class="top-bar">
      <h1>Platform Command Center</h1>
      <button class="refresh-btn" id="signout-btn">Sign out</button>
    </div>

    <div id="overview-panel"></div>
    <div id="directory-panel"></div>
    <div id="detail-panel" class="hidden"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hbghbextytgrpnzbsppz.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhiZ2hiZXh0eXRncnBuemJzcHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg0MDIxMDksImV4cCI6MjA3Mzk3ODEwOX0.LXlv55Vm3liQagC-zWAeQ3pl9G_x1lL1zVmq-_uUm24';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const loginView = document.getElementById('login-view');
    const appView = document.getElementById('app-view');
    const loginError = document.getElementById('login-error');

    function fmtDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString();
    }
    function fmtRelative(iso) {
      if (!iso) return 'never';
      const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
      if (days === 0) return 'today';
      if (days === 1) return '1 day ago';
      return `${days} days ago`;
    }

    async function attemptLogin() {
      loginError.textContent = '';
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        loginError.textContent = 'Sign-in failed.';
        return;
      }
      await enterApp();
    }

    async function enterApp() {
      // A successful Supabase login does NOT imply platform-admin access.
      // The real gate is inside platform_admin_overview() — if it throws
      // "unauthorized", this session is signed out immediately.
      const { data, error } = await sb.rpc('platform_admin_overview');
      if (error) {
        loginError.textContent = 'Not authorized for the Platform Command Center.';
        await sb.auth.signOut();
        return;
      }
      loginView.classList.add('hidden');
      appView.classList.remove('hidden');
      renderOverview(data);
      await loadDirectory();
    }

    function renderOverview(o) {
      const el = document.getElementById('overview-panel');
      el.innerHTML = `
        <div class="card metric-grid">
          <div class="metric-group">
            <h2>Users</h2>
            <div class="metric"><span>Registered</span><span class="value">${o.users.registered}</span></div>
            <div class="metric"><span>New today</span><span class="value">${o.users.new_today}</span></div>
            <div class="metric"><span>New this week</span><span class="value">${o.users.new_week}</span></div>
            <div class="metric"><span>New this month</span><span class="value">${o.users.new_month}</span></div>
          </div>
          <div class="metric-group">
            <h2>Members</h2>
            <div class="metric"><span>Total member records</span><span class="value">${o.members.total_records}</span></div>
            <div class="metric"><span>Registered</span><span class="value">${o.members.registered}</span></div>
            <div class="metric"><span>Awaiting registration</span><span class="value">${o.members.unregistered}</span></div>
            <div class="metric"><span>Registration %</span><span class="value">${o.members.registration_pct}%</span></div>
            <p class="note">"Member records" is when a member was created — often by an org admin, before that person ever signs in. "Registered" is a real Supabase Auth account. These are intentionally different numbers.</p>
          </div>
          <div class="metric-group">
            <h2>Organizations</h2>
            <div class="metric"><span>Total</span><span class="value">${o.organizations.total}</span></div>
            <div class="metric"><span>New today</span><span class="value">${o.organizations.new_today}</span></div>
            <div class="metric"><span>New this week</span><span class="value">${o.organizations.new_week}</span></div>
            <div class="metric"><span>Active (14d)</span><span class="value">${o.organizations.active}</span></div>
            <div class="metric"><span>Inactive</span><span class="value">${o.organizations.inactive}</span></div>
            <p class="note">"Active" means the org has a meaningful logged action (attendance marked, member added, program created, etc. — not logins) in the last 14 days.</p>
          </div>
        </div>
        <div class="card">
          <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;">Recent activity</h2>
          ${o.recent_activity.length === 0 ? '<p class="note">No recorded activity yet.</p>' : `
          <table><tbody>
            ${o.recent_activity.map(a => `
              <tr>
                <td>${fmtDate(a.created_at)}</td>
                <td>${a.action.replace(/_/g, ' ')}</td>
                <td>${a.org_name || '—'}</td>
                <td>${a.actor_name || '—'}</td>
              </tr>`).join('')}
          </tbody></table>`}
        </div>
      `;
    }

    const DIRECTORY_PAGE_SIZE = 50;
    let directoryRows = [];

    async function loadDirectory(offset = 0) {
      const { data, error } = await sb.rpc('platform_admin_list_organizations', { p_limit: DIRECTORY_PAGE_SIZE, p_offset: offset });
      const el = document.getElementById('directory-panel');
      if (error) {
        el.innerHTML = `<div class="card">Failed to load organization directory.</div>`;
        return;
      }
      directoryRows = offset === 0 ? data : directoryRows.concat(data);
      const hasMore = data.length === DIRECTORY_PAGE_SIZE;
      el.innerHTML = `
        <div class="card">
          <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;">
            Organization directory
            <span style="text-transform:none;letter-spacing:normal;font-weight:400;">— showing ${directoryRows.length}${hasMore ? '+' : ''}</span>
          </h2>
          <table>
            <thead><tr><th>Name</th><th>Created</th><th>Members</th><th>Registered</th><th>Last activity</th><th>Status</th></tr></thead>
            <tbody>
              ${directoryRows.map(org => `
                <tr class="org-row" data-org-id="${org.id}">
                  <td>${org.name}</td>
                  <td>${fmtDate(org.created_at)}</td>
                  <td>${org.member_count}</td>
                  <td>${org.registered_member_count}</td>
                  <td>${fmtRelative(org.last_activity_at)}</td>
                  <td><span class="badge ${org.is_active ? 'active' : 'inactive'}">${org.is_active ? 'Active' : 'Inactive'}</span></td>
                </tr>`).join('')}
            </tbody>
          </table>
          ${hasMore ? `<button class="refresh-btn" id="load-more-orgs" style="margin-top:16px;">Load more</button>` : ''}
        </div>
      `;
      el.querySelectorAll('.org-row').forEach(row => {
        row.addEventListener('click', () => showOrgDetail(row.dataset.orgId));
      });
      const loadMoreBtn = document.getElementById('load-more-orgs');
      if (loadMoreBtn) {
        loadMoreBtn.addEventListener('click', () => loadDirectory(directoryRows.length));
      }
    }

    async function showOrgDetail(orgId) {
      const { data, error } = await sb.rpc('platform_admin_get_organization', { p_org_id: orgId });
      const detail = document.getElementById('detail-panel');
      const overview = document.getElementById('overview-panel');
      const directory = document.getElementById('directory-panel');
      if (error || !data) {
        detail.innerHTML = `<div class="card">Organization not found.</div>`;
      } else {
        detail.innerHTML = `
          <span class="back-link" id="back-to-directory">&larr; Back to directory</span>
          <div class="card">
            <h2 style="font-size:18px;font-weight:800;margin-bottom:16px;">${data.name}</h2>
            <div class="metric"><span>Created</span><span class="value">${fmtDate(data.created_at)}</span></div>
            <div class="metric"><span>Org record status</span><span class="value">${data.status}</span></div>
            <div class="metric"><span>Owner</span><span class="value">${data.owner_name || '—'}</span></div>
            <div class="metric"><span>Units</span><span class="value">${data.unit_count}</span></div>
            <div class="metric"><span>Members</span><span class="value">${data.member_count}</span></div>
            <div class="metric"><span>Registered members</span><span class="value">${data.registered_member_count}</span></div>
            <div class="metric"><span>Last activity</span><span class="value">${fmtRelative(data.last_activity_at)}</span></div>
            <div class="metric"><span>Activity status (14d)</span><span class="value"><span class="badge ${data.is_active ? 'active' : 'inactive'}">${data.is_active ? 'Active' : 'Inactive'}</span></span></div>
          </div>
          <div class="card">
            <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;">Recent activity</h2>
            ${data.recent_activity.length === 0 ? '<p class="note">No recorded activity yet.</p>' : `
            <table><tbody>
              ${data.recent_activity.map(a => `<tr><td>${fmtDate(a.created_at)}</td><td>${a.action.replace(/_/g, ' ')}</td><td>${a.actor_name || '—'}</td></tr>`).join('')}
            </tbody></table>`}
          </div>
        `;
        document.getElementById('back-to-directory').addEventListener('click', () => {
          detail.classList.add('hidden');
          overview.classList.remove('hidden');
          directory.classList.remove('hidden');
        });
      }
      overview.classList.add('hidden');
      directory.classList.add('hidden');
      detail.classList.remove('hidden');
    }

    document.getElementById('login-btn').addEventListener('click', attemptLogin);
    document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });
    document.getElementById('signout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
      location.reload();
    });

    // If already signed in (session persisted), try straight into the app.
    sb.auth.getSession().then(({ data }) => {
      if (data.session) enterApp();
    });
  </script>
</body>
</html>
