<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Rally Command Center</title>
  <link rel="icon" href="/assets/appicon.png" />
  <script>(function(){try{var t=localStorage.getItem('rally-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/assets/control-room.css" />
  <style>
    .brand .tag { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500; letter-spacing: 1px; color: var(--gold); border: 1px solid var(--line-strong); border-radius: 6px; padding: 2px 6px; text-transform: uppercase; }
    :root[data-theme="light"] .brand .tag { color: var(--blue); }
    .hero-num { font-size: 96px; font-weight: 800; letter-spacing: -4px; line-height: .95; margin: 18px 0 6px; }
    .hero-split { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .hero-split div { font-size: 12px; color: var(--muted); }
    .hero-split b { display: block; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: var(--text); font-weight: 600; margin-bottom: 2px; }
    .bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-top: 18px; }
    .bars .b { flex: 1; border-radius: 4px 4px 2px 2px; background: var(--line-strong); min-height: 3px; position: relative; }
    .bars .b.today { background: var(--gold); }
    .bars .b:hover { background: var(--blue); }
    .bars .b:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line-strong); padding: 4px 8px; border-radius: 8px; font-size: 11.5px; white-space: nowrap; z-index: 2; }
    .bars-axis { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); margin-top: 6px; }
    .funnel { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
    .funnel .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 7px; }
    .funnel .top b { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    .funnel .bar { height: 10px; }
    .health { display: flex; align-items: center; gap: 20px; margin-top: 14px; }
    .health .legend { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
    .health .legend span { display: flex; align-items: center; gap: 8px; }
    .health .legend i { width: 9px; height: 9px; border-radius: 3px; }
    .health .legend b { font-family: 'JetBrains Mono', monospace; margin-left: auto; padding-left: 14px; }
    .org-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .org-row:last-child { border-bottom: 0; }
    .org-row:hover .on { color: var(--gold); }
    .org-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; flex-shrink: 0; }
    .org-row .on { font-weight: 600; transition: color .12s; }
    .org-row small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
    .org-row .rt { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
    .act-row { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
    .act-row:last-child { border-bottom: 0; }
    .act-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; font-size: 13px; }
    .act-row .tx { font-size: 13.5px; line-height: 1.4; min-width: 0; }
    .act-row .tx b { font-weight: 600; }
    .act-row .tx small { display: block; color: var(--muted); font-size: 12px; }
    .act-row .when { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--muted); white-space: nowrap; padding-left: 10px; }
    .day-head { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); padding: 16px 0 4px; }
    .filters { display: flex; gap: 6px; }
    .chip-btn { border: 1px solid var(--line); background: var(--raise); color: var(--muted); border-radius: 99px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
    .chip-btn.on { border-color: var(--gold); color: var(--text); }
    .load-more { display: block; margin: 16px auto 0; border: 1px solid var(--line-strong); background: var(--raise); color: var(--text); border-radius: 10px; padding: 9px 18px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <div id="login-view">
    <section class="login-art">
      <div class="brand"><span class="mk">R</span>Rally <span class="tag">Internal</span></div>
      <svg class="rings" viewBox="0 0 620 620" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#7C86FF"/><stop offset="1" stop-color="#FCD400"/></linearGradient></defs>
        <circle cx="310" cy="310" r="290" fill="none" stroke="rgba(160,168,255,.08)" stroke-width="2"/>
        <circle cx="310" cy="310" r="230" fill="none" stroke="rgba(160,168,255,.1)" stroke-width="22"/>
        <circle cx="310" cy="310" r="230" fill="none" stroke="url(#lg)" stroke-width="22" stroke-linecap="round" stroke-dasharray="1445" stroke-dashoffset="520" transform="rotate(-90 310 310)"/>
        <circle cx="310" cy="310" r="170" fill="none" stroke="rgba(160,168,255,.08)" stroke-width="2" stroke-dasharray="4 10"/>
      </svg>
      <div>
        <h2>Every sign-up, <em>every organization.</em></h2>
        <p>Platform-wide growth, organization health and activity across all of Rally.</p>
      </div>
      <div class="foot">Restricted to Rally platform admins.</div>
    </section>
    <section class="login-form">
      <form class="login-card" id="login-form" novalidate>
        <h1>Command Center</h1>
        <p class="sub">Sign in with your platform admin account.</p>
        <label class="field"><span>Email</span><input id="login-email" type="email" autocomplete="username" required /></label>
        <label class="field"><span>Password</span><input id="login-password" type="password" autocomplete="current-password" required /></label>
        <button class="btn-primary" id="login-btn" type="submit">Sign in</button>
        <div id="login-error" role="alert"></div>
      </form>
    </section>
  </div>

  <div id="app-view" class="hidden">
    <header class="top">
      <div class="brand"><span class="mk">R</span>Rally <span class="tag">Command Center</span></div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-panel="overview">Overview</button>
        <button class="tab" data-panel="orgs">Organizations</button>
        <button class="tab" data-panel="activity">Activity</button>
      </nav>
      <div class="hdr-right">
        <button class="icon-btn" id="refresh-btn" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
        <button class="icon-btn" id="theme-btn" title="Switch light or dark" aria-label="Switch light or dark"></button>
        <div class="me">
          <button class="me-btn" id="me-btn" aria-haspopup="true" aria-expanded="false"><span class="avatar" id="me-avatar">RA</span></button>
          <div class="me-menu hidden" id="me-menu">
            <div class="who"><b id="me-name">Platform admin</b><small id="me-email"></small></div>
            <button id="signout-btn">Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="title-row">
        <div>
          <div id="live-slot"></div>
          <h1 id="page-title">Platform pulse</h1>
          <p id="page-sub"></p>
        </div>
        <div class="seg" id="period-seg" role="group" aria-label="Period">
          <button data-days="14">14 days</button>
          <button data-days="30" class="on">30 days</button>
          <button data-days="90">90 days</button>
        </div>
      </div>
      <div id="panel-overview" class="panel"></div>
      <div id="panel-orgs" class="panel hidden"></div>
      <div id="panel-activity" class="panel hidden"></div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div><h2 id="drawer-title"></h2><p id="drawer-sub"></p></div>
      <button class="icon-btn" id="drawer-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script>
    const SUPABASE_URL = 'https://hbghbextytgrpnzbsppz.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhiZ2hiZXh0eXRncnBuemJzcHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg0MDIxMDksImV4cCI6MjA3Mzk3ODEwOX0.LXlv55Vm3liQagC-zWAeQ3pl9G_x1lL1zVmq-_uUm24';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const $ = (id) => document.getElementById(id);
    const loginView = $('login-view');
    const appView = $('app-view');
    const loginError = $('login-error');

    let state = { panel: 'overview', days: 30, metric: 'users', overview: null, loadedAt: null };
    let directory = { rows: [], hasMore: false, filter: 'all', q: '' };
    const DIRECTORY_PAGE_SIZE = 50;

    // ---------- helpers ----------
    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    const NIL = '<span class="nil">-</span>';
    function fmtInt(n) { return (n ?? 0).toLocaleString(); }
    function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : NIL; }
    function fmtClock(iso) { return new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false }); }
    function ago(iso) {
      if (!iso) return 'never';
      const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins} min ago`;
      const h = Math.round(mins / 60);
      if (h < 24) return `${h} hour${h === 1 ? '' : 's'} ago`;
      const d = Math.round(h / 24);
      return `${d} day${d === 1 ? '' : 's'} ago`;
    }
    function initials(name) { return (name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?'; }
    const HUES = ['#3B43C4', '#0E7490', '#7C3AED', '#B45309', '#15803D', '#BE185D', '#1D4ED8', '#9333EA'];
    function hue(name) { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return HUES[h % HUES.length]; }
    function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
    function emptyState(title, body) { return `<div class="empty"><b>${esc(title)}</b>${esc(body || '')}</div>`; }
    function errorCard(what) { return `<div class="card error-card"><b>Couldn't load ${esc(what)}.</b>Check your connection, then press refresh to try again.</div>`; }
    function skeleton(heights) { return `<div class="bento">${heights.map(([span, h]) => `<div class="skeleton span-${span}" style="height:${h}px"></div>`).join('')}</div>`; }
    function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
    function ring(p, size = 40, stroke = 4, color) {
      const r = (size - stroke) / 2, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, p || 0));
      return `<svg class="ring" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${css('--line')}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color || css('--gold')}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(v / 100 * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
    }

    // Plain-language labels for activity_logs.action values.
    const ACTION_COPY = {
      member_added: ['added a member', '+', 'good'], member_removed: ['removed a member', '−', 'bad'], member_reactivated: ['reactivated a member', '↺', 'info'],
      member_role_changed: ['changed a member\'s role', '⇄', 'info'], member_approved: ['approved a member', '✓', 'good'], member_linked: ['linked a member account', '⛓', 'info'],
      admin_deleted_member: ['deleted a member', '−', 'bad'], account_deleted: ['deleted their account', '−', 'bad'],
      registration_approved: ['approved a registration', '✓', 'good'], registration_rejected: ['declined a registration', '✕', 'bad'],
      attendance_marked: ['marked attendance', '●', 'warn'], unit_attendance_reset: ['reset branch attendance', '↺', 'bad'],
      program_created: ['created a program', '+', 'info'], program_updated: ['updated a program', '✎', 'info'], program_status_changed: ['changed a program\'s status', '⇄', 'info'],
      group_created: ['created a team', '+', 'info'], group_archived: ['archived a team', '▢', 'neutral'], group_unarchived: ['restored a team', '↺', 'info'], group_leader_changed: ['changed a team leader', '⇄', 'info'],
      unit_created: ['created a branch', '+', 'good'], unit_archived: ['archived a branch', '▢', 'neutral'], unit_unarchived: ['restored a branch', '↺', 'info'],
      excuse_approved: ['approved an excuse', '✓', 'good'], excuse_rejected: ['declined an excuse', '✕', 'bad'],
      event_registration_created: ['got an event registration', '✦', 'warn'], event_registration_cancelled: ['had a registration cancelled', '✕', 'bad'],
      event_registration_credentials_reissued: ['reissued a ticket', '↺', 'info'], event_checkin_performed: ['checked someone in at an event', '●', 'good'],
      event_staff_granted: ['added event staff', '+', 'info'], event_staff_revoked: ['removed event staff', '−', 'neutral'], event_payment_confirmed: ['received an event payment', '₦', 'good'],
    };
    const TONE_BG = { good: ['--good-bg', '--good'], bad: ['--bad-bg', '--bad'], warn: ['--warn-bg', '--warn'], info: ['--blue-bg', '--blue'], neutral: ['--raise', '--muted'] };
    function actRow(a, withOrg = true) {
      const [verb, icon, tone] = ACTION_COPY[a.action] || [String(a.action || '').replace(/_/g, ' '), '•', 'neutral'];
      const [bg, fg] = TONE_BG[tone];
      const who = a.actor_name ? `<b>${esc(a.actor_name)}</b> ` : 'Someone ';
      return `<div class="act-row">
        <span class="act-ic" style="background:var(${bg});color:var(${fg})">${icon}</span>
        <div class="tx">${who}${esc(verb)}${withOrg && a.org_name ? `<small>${esc(a.org_name)}</small>` : ''}</div>
        <span class="when" title="${esc(new Date(a.created_at).toLocaleString())}">${esc(ago(a.created_at))}</span>
      </div>`;
    }

    function lineChart(el, { labels, series, height = 220 }) {
      const W = Math.max(el.clientWidth, 300), H = height, padL = 30, padB = 22, padT = 8;
      const all = series.flatMap(s => s.values);
      const maxV = Math.max(4, Math.ceil(Math.max(0, ...all) * 1.15));
      const n = labels.length;
      const x = i => padL + (n <= 1 ? 0 : i / (n - 1)) * (W - padL - 4);
      const y = v => padT + (1 - v / maxV) * (H - padT - padB);
      const path = vals => vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
      const ticks = [0, Math.round(maxV / 2), maxV];
      const grid = ticks.map(t => `<line x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="${css('--line')}" stroke-dasharray="3 5"/><text x="0" y="${y(t) + 4}" fill="${css('--muted')}" font-size="10" font-family="JetBrains Mono">${t}</text>`).join('');
      const step = Math.max(1, Math.ceil(n / 7));
      const xl = labels.map((l, i) => (i % step === 0 || i === n - 1) && !(i !== n - 1 && n - 1 - i < step / 2) ? `<text x="${x(i)}" y="${H - 4}" fill="${css('--muted')}" font-size="10" text-anchor="middle" font-family="JetBrains Mono">${esc(l)}</text>` : '').join('');
      const main = series[0];
      el.innerHTML = `
        <svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">
          <defs><linearGradient id="fill-${el.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${main.color}" stop-opacity=".26"/><stop offset="1" stop-color="${main.color}" stop-opacity="0"/></linearGradient></defs>
          ${grid}${xl}
          <path d="${path(main.values)}L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="url(#fill-${el.id})"/>
          ${series.slice().reverse().map(s => `<path d="${path(s.values)}" fill="none" stroke="${s.color}" stroke-width="${s === main ? 2.4 : 1.8}" ${s.dash ? 'stroke-dasharray="4 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`).join('')}
          <line class="hover-line" x1="0" x2="0" y1="${padT}" y2="${H - padB}" stroke="${css('--line-strong')}" opacity="0"/>
        </svg>
        <div class="tip"></div>`;
      const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), hl = el.querySelector('.hover-line');
      svg.addEventListener('mousemove', (e) => {
        const rect = svg.getBoundingClientRect();
        const px = (e.clientX - rect.left) * (W / rect.width);
        const i = Math.max(0, Math.min(n - 1, Math.round((px - padL) / ((W - padL - 4) / Math.max(1, n - 1)))));
        hl.setAttribute('x1', x(i)); hl.setAttribute('x2', x(i)); hl.setAttribute('opacity', 1);
        tip.innerHTML = `<small>${esc(labels[i])}</small>${series.map(s => `<div><span class="key"><i style="background:${s.color}"></i>${esc(s.name)}</span> <b>${fmtInt(s.values[i])}</b></div>`).join('')}`;
        tip.style.left = `${(x(i) / W) * rect.width}px`;
        tip.style.top = `${(y(Math.max(...series.map(s => s.values[i]))) / H) * rect.height}px`;
        tip.style.opacity = 1;
      });
      svg.addEventListener('mouseleave', () => { hl.setAttribute('opacity', 0); tip.style.opacity = 0; });
    }

    // ---------- theme ----------
    const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>';
    const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>';
    function isLight() { return document.documentElement.getAttribute('data-theme') === 'light'; }
    function paintThemeBtn() { $('theme-btn').innerHTML = isLight() ? MOON : SUN; }
    $('theme-btn').addEventListener('click', () => {
      const next = isLight() ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('rally-theme', next); } catch (e) {}
      paintThemeBtn();
      renderPanel(state.panel);
    });
    paintThemeBtn();

    // ---------- auth ----------
    async function attemptLogin(e) {
      e?.preventDefault();
      loginError.textContent = '';
      const email = $('login-email').value.trim();
      const password = $('login-password').value;
      if (!email || !password) { loginError.textContent = 'Enter your email and password.'; return; }
      const btn = $('login-btn'); btn.disabled = true; btn.textContent = 'Signing in…';
      const { error } = await sb.auth.signInWithPassword({ email, password });
      btn.disabled = false; btn.textContent = 'Sign in';
      if (error) { loginError.textContent = 'That email and password don\'t match a Rally account.'; return; }
      await enterApp();
    }

    async function enterApp() {
      // A successful Supabase login does NOT imply platform-admin access.
      // The real gate is inside platform_admin_overview(): if it throws
      // "unauthorized", this session is signed out immediately.
      const { data, error } = await sb.rpc('platform_admin_overview');
      if (error) {
        loginError.textContent = 'This account isn\'t a Rally platform admin.';
        await sb.auth.signOut();
        return;
      }
      const { data: u } = await sb.auth.getUser();
      const email = u?.user?.email || '';
      $('me-email').textContent = email;
      $('me-avatar').textContent = initials(email.split('@')[0].replace(/[._-]+/g, ' '));
      state.overview = data;
      state.loadedAt = new Date();
      loginView.classList.add('hidden');
      appView.classList.remove('hidden');
      wireApp();
      await switchPanel('overview');
    }

    let wired = false;
    function wireApp() {
      if (wired) return; wired = true;
      document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchPanel(t.dataset.panel)));
      document.querySelectorAll('#period-seg button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('#period-seg button').forEach(x => x.classList.toggle('on', x === b));
        state.days = parseInt(b.dataset.days, 10);
        loadGrowth();
      }));
      $('me-btn').addEventListener('click', (e) => { e.stopPropagation(); const open = !$('me-menu').classList.toggle('hidden'); $('me-btn').setAttribute('aria-expanded', String(open)); });
      document.addEventListener('click', () => $('me-menu').classList.add('hidden'));
      $('signout-btn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
      $('refresh-btn').addEventListener('click', refreshAll);
      let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { if (state.panel === 'overview' && lastGrowth) drawGrowth(lastGrowth); }, 150); });
      setInterval(() => { if (!document.hidden) refreshAll(true); }, 60000);
    }

    async function refreshAll(quiet) {
      const btn = $('refresh-btn');
      btn.style.transition = 'transform .6s'; btn.style.transform = 'rotate(360deg)';
      setTimeout(() => { btn.style.transition = ''; btn.style.transform = ''; }, 650);
      const { data, error } = await sb.rpc('platform_admin_overview');
      if (!error && data) { state.overview = data; state.loadedAt = new Date(); }
      directory.rows = [];
      if (!quiet || state.panel !== 'orgs') renderPanel(state.panel);
    }

    const PANEL_COPY = {
      overview: ['Platform pulse', 'Sign-ups, organizations and activity across all of Rally'],
      orgs: ['Organizations', 'Every organization on Rally, newest first'],
      activity: ['Activity', 'The latest meaningful actions across every organization'],
    };

    async function switchPanel(name) {
      state.panel = name;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.panel === name));
      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('hidden', p.id !== `panel-${name}`));
      $('page-title').textContent = PANEL_COPY[name][0];
      $('page-sub').textContent = PANEL_COPY[name][1];
      $('period-seg').classList.toggle('hidden', name !== 'overview');
      closeDrawer();
      await renderPanel(name);
    }

    function renderPanel(name) {
      $('live-slot').innerHTML = `<span class="live-pill on"><i></i>Updated ${esc(state.loadedAt ? fmtClock(state.loadedAt.toISOString()) : 'now')} · refreshes every minute</span>`;
      if (name === 'overview') return renderOverview();
      if (name === 'orgs') return renderOrgs();
      if (name === 'activity') return renderActivity();
    }

    // ---------- drawer ----------
    function openDrawer(title, sub, html) {
      $('drawer-title').textContent = title; $('drawer-sub').textContent = sub || ''; $('drawer-body').innerHTML = html;
      $('drawer').classList.add('open'); $('scrim').classList.add('open'); $('drawer').setAttribute('aria-hidden', 'false');
    }
    function closeDrawer() { $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true'); }
    $('drawer-close').addEventListener('click', closeDrawer);
    $('scrim').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

    // ---------- overview ----------
    let lastGrowth = null;
    // One metric at a time: member records run 10x user sign-ups, so
    // sharing an axis would flatten the line people care about most.
    const GROWTH_METRICS = [
      { key: 'users', name: 'Users', color: '--gold' },
      { key: 'organizations', name: 'Organizations', color: '--good' },
      { key: 'members', name: 'Member records', color: '--blue' },
    ];

    async function renderOverview() {
      const el = $('panel-overview');
      const o = state.overview;
      if (!o) { el.innerHTML = errorCard('the overview'); return; }
      const u = o.users, m = o.members, g = o.organizations;
      const activePct = pct(g.active, g.total);

      el.innerHTML = `
        <div class="bento">
          <section class="card span-5" style="grid-row: span 2; display:flex; flex-direction:column">
            <div class="lbl">New users today <span class="aside mono" style="color:var(--gold)">${esc(new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }))}</span></div>
            <div class="hero-num">${fmtInt(u.new_today)}</div>
            <div class="note">${u.new_today ? `${fmtInt(u.new_today)} ${u.new_today === 1 ? 'person' : 'people'} created a Rally account today.` : 'No new accounts yet today.'}</div>
            <div class="bars" id="signup-bars"></div>
            <div class="bars-axis"><span id="bars-from"></span><span>Today</span></div>
            <div class="hero-split" style="margin-top:auto">
              <div><b>${fmtInt(u.new_week)}</b>last 7 days</div>
              <div><b>${fmtInt(u.new_month)}</b>last 30 days</div>
              <div><b>${fmtInt(u.registered)}</b>all time</div>
            </div>
          </section>

          <div class="span-7 stats">
            <div class="card stat"><div class="lbl">Users</div><b>${fmtInt(u.registered)}</b><div class="s"><span class="up">+${fmtInt(u.new_week)}</span> this week</div></div>
            <div class="card stat"><div class="lbl">Organizations</div><b>${fmtInt(g.total)}</b><div class="s">${g.new_week ? `<span class="up">+${fmtInt(g.new_week)}</span> this week` : 'None new this week'}</div></div>
            <div class="card stat"><div class="lbl">Member records</div><b>${fmtInt(m.total_records)}</b><div class="s">${m.new_week ? `<span class="up">+${fmtInt(m.new_week)}</span> this week` : `${m.registration_pct}% have signed up`}</div></div>
            <div class="card stat"><div class="lbl">Active orgs</div><b>${fmtInt(g.active)}</b><div class="s">${activePct}% active in 14 days</div></div>
          </div>

          <section class="card span-7">
            <div class="lbl"><span>New per day, last <span id="growth-days">${state.days}</span> days</span>
              <span class="filters" id="growth-metric">
                ${GROWTH_METRICS.map(g => `<button class="chip-btn ${g.key === state.metric ? 'on' : ''}" data-m="${g.key}" style="text-transform:none;letter-spacing:0">${g.name}</button>`).join('')}
              </span>
            </div>
            <div class="chart" id="growth-chart"><div class="skeleton" style="height:220px;margin-top:14px"></div></div>
          </section>

          <section class="card span-4">
            <div class="lbl">Organization health</div>
            <div class="health">
              ${ring(activePct, 118, 14, css('--good'))}
              <div class="legend">
                <span><i style="background:var(--good)"></i>Active, 14 days<b>${fmtInt(g.active)}</b></span>
                <span><i style="background:var(--line-strong)"></i>Inactive<b>${fmtInt(g.inactive)}</b></span>
                <span><i style="background:var(--gold)"></i>New this month<b>${fmtInt(g.new_month)}</b></span>
              </div>
            </div>
            <p class="note" style="margin-top:14px">Active means attendance, members, programs or events changed in the last 14 days. Logins don't count.</p>
          </section>

          <section class="card span-4">
            <div class="lbl">Member sign-up funnel</div>
            <div class="funnel">
              <div><div class="top"><span>Member records created</span><b>${fmtInt(m.total_records)}</b></div><div class="bar"><i style="width:100%;background:var(--blue)"></i></div></div>
              <div><div class="top"><span>Signed up for an account</span><b>${fmtInt(m.registered)}</b></div><div class="bar"><i style="width:${m.registration_pct}%"></i></div></div>
              <div><div class="top"><span>Still to sign up</span><b>${fmtInt(m.unregistered)}</b></div><div class="bar"><i style="width:${100 - m.registration_pct}%;background:var(--line-strong)"></i></div></div>
            </div>
            <p class="note" style="margin-top:14px">${m.registration_pct}% of member records have a Rally account. Admins often add members before those people ever install the app.</p>
          </section>

          <section class="card span-4">
            <div class="lbl">Newest organizations <a data-go="orgs">All</a></div>
            <div id="newest-orgs" style="margin-top:4px"><div class="skeleton" style="height:220px;margin-top:10px"></div></div>
          </section>

          <section class="card span-12">
            <div class="lbl">Latest activity <a data-go="activity">See all</a></div>
            <div style="margin-top:4px; display:grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); column-gap: 32px">
              ${o.recent_activity.length === 0 ? emptyState('No activity yet', 'Actions from organizations show up here.') : o.recent_activity.slice(0, 8).map(a => actRow(a)).join('')}
            </div>
          </section>
        </div>`;
      el.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => switchPanel(b.dataset.go)));
      el.querySelectorAll('#growth-metric button').forEach(b => b.addEventListener('click', () => {
        state.metric = b.dataset.m;
        el.querySelectorAll('#growth-metric button').forEach(x => x.classList.toggle('on', x === b));
        if (lastGrowth) drawGrowth(lastGrowth);
      }));
      await Promise.all([loadGrowth(), loadNewestOrgs()]);
    }

    async function loadGrowth() {
      const span = $('growth-days'); if (span) span.textContent = state.days;
      const { data, error } = await sb.rpc('platform_admin_growth_daily', { p_days: Math.max(state.days, 14) });
      if (state.panel !== 'overview') return;
      const chart = $('growth-chart');
      if (error || !data) { if (chart) chart.innerHTML = emptyState('Growth chart unavailable', 'Press refresh to try again.'); return; }
      lastGrowth = data;
      drawGrowth(data);
    }

    function drawGrowth(rows) {
      const chart = $('growth-chart');
      if (!chart) return;
      const period = rows.slice(-state.days);
      const label = r => new Date(r.day + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      const metric = GROWTH_METRICS.find(g => g.key === state.metric) || GROWTH_METRICS[0];
      lineChart(chart, {
        labels: period.map(label),
        series: [{ name: metric.name, color: css(metric.color), values: period.map(r => r[metric.key]) }],
      });
      // Last 14 days of user sign-ups as bars in the hero card.
      const bars = $('signup-bars');
      if (bars) {
        const last = rows.slice(-14);
        const max = Math.max(1, ...last.map(r => r.users));
        bars.innerHTML = last.map((r, i) => `<div class="b ${i === last.length - 1 ? 'today' : ''}" style="height:${Math.max(3, (r.users / max) * 100)}%" data-tip="${esc(label(r))} · ${fmtInt(r.users)}"></div>`).join('');
        $('bars-from').textContent = label(last[0]);
      }
    }

    async function loadNewestOrgs() {
      if (directory.rows.length === 0) await fetchDirectory(0);
      const box = $('newest-orgs');
      if (!box) return;
      const rows = directory.rows.slice(0, 5);
      box.innerHTML = rows.length === 0 ? emptyState('No organizations yet', '') : rows.map(orgRow).join('');
      box.querySelectorAll('.org-row').forEach(r => r.addEventListener('click', () => showOrgDetail(r.dataset.orgId)));
    }

    function orgRow(org) {
      return `<div class="org-row" data-org-id="${esc(org.id)}">
        <span class="org-mark" style="background:${hue(org.name)}">${esc(initials(org.name))}</span>
        <div style="min-width:0"><div class="on">${esc(org.name)}</div><small>${fmtInt(org.member_count)} members · created ${esc(ago(org.created_at))}</small></div>
        <div class="rt"><span class="badge ${org.is_active ? 'good' : 'neutral'}">${org.is_active ? 'Active' : 'Quiet'}</span></div>
      </div>`;
    }

    // ---------- organizations ----------
    async function fetchDirectory(offset) {
      const { data, error } = await sb.rpc('platform_admin_list_organizations', { p_limit: DIRECTORY_PAGE_SIZE, p_offset: offset });
      if (error) return false;
      directory.rows = offset === 0 ? (data || []) : directory.rows.concat(data || []);
      directory.hasMore = (data || []).length === DIRECTORY_PAGE_SIZE;
      return true;
    }

    async function renderOrgs() {
      const el = $('panel-orgs');
      if (directory.rows.length === 0) {
        el.innerHTML = skeleton([[12, 520]]);
        const ok = await fetchDirectory(0);
        if (state.panel !== 'orgs') return;
        if (!ok) { el.innerHTML = errorCard('the organization directory'); return; }
      }
      const o = state.overview?.organizations || {};
      el.innerHTML = `
        <div class="stats" style="margin-bottom:14px">
          <div class="card stat"><div class="lbl">Total</div><b>${fmtInt(o.total)}</b><div class="s">Organizations on Rally</div></div>
          <div class="card stat"><div class="lbl">Active</div><b>${fmtInt(o.active)}</b><div class="s">In the last 14 days</div></div>
          <div class="card stat"><div class="lbl">Quiet</div><b>${fmtInt(o.inactive)}</b><div class="s">No activity in 14 days</div></div>
          <div class="card stat"><div class="lbl">New</div><b>${fmtInt(o.new_month)}</b><div class="s">${fmtInt(o.new_today)} today · ${fmtInt(o.new_week)} this week</div></div>
        </div>
        <section class="card">
          <div class="toolbar" style="justify-content:space-between">
            <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="org-q" placeholder="Search loaded organizations" value="${esc(directory.q)}" /></label>
            <div class="filters">
              <button class="chip-btn" data-f="all">All</button>
              <button class="chip-btn" data-f="active">Active</button>
              <button class="chip-btn" data-f="inactive">Quiet</button>
            </div>
          </div>
          <div id="org-table"></div>
        </section>`;
      const draw = () => {
        el.querySelectorAll('.chip-btn').forEach(b => b.classList.toggle('on', b.dataset.f === directory.filter));
        const q = directory.q.trim().toLowerCase();
        const rows = directory.rows.filter(r =>
          (directory.filter === 'all' || (directory.filter === 'active') === !!r.is_active) &&
          (!q || String(r.name).toLowerCase().includes(q)));
        $('org-table').innerHTML = (rows.length === 0 ? emptyState('No organizations match', 'Try a different search or filter.') : `
          <div class="table-wrap"><table>
            <thead><tr><th>Organization</th><th>Created</th><th class="num">Members</th><th style="width:18%">Signed up</th><th class="num"></th><th>Last activity</th><th>Status</th></tr></thead>
            <tbody>${rows.map(org => {
              const p = pct(org.registered_member_count, org.member_count);
              return `<tr class="click" data-org-id="${esc(org.id)}">
                <td><div class="person" style="padding:0"><span class="org-mark" style="background:${hue(org.name)};width:28px;height:28px;font-size:10.5px;border-radius:8px">${esc(initials(org.name))}</span><b>${esc(org.name)}</b></div></td>
                <td>${fmtDate(org.created_at)}</td>
                <td class="num">${fmtInt(org.member_count)}</td>
                <td><div class="bar"><i style="width:${p}%"></i></div></td>
                <td class="num">${fmtInt(org.registered_member_count)} <span class="nil">(${p}%)</span></td>
                <td>${esc(ago(org.last_activity_at))}</td>
                <td><span class="badge ${org.is_active ? 'good' : 'neutral'}">${org.is_active ? 'Active' : 'Quiet'}</span></td>
              </tr>`;
            }).join('')}</tbody>
          </table></div>`) +
          `<p class="note" style="margin-top:12px">Showing ${fmtInt(directory.rows.length)}${directory.hasMore ? '+' : ''} organizations. Search and filters apply to the ones loaded.</p>` +
          (directory.hasMore ? '<button class="load-more" id="load-more">Load 50 more</button>' : '');
        $('org-table').querySelectorAll('tr.click').forEach(r => r.addEventListener('click', () => showOrgDetail(r.dataset.orgId)));
        const more = $('load-more');
        if (more) more.addEventListener('click', async () => { more.disabled = true; more.textContent = 'Loading…'; await fetchDirectory(directory.rows.length); draw(); });
      };
      el.querySelectorAll('.chip-btn').forEach(b => b.addEventListener('click', () => { directory.filter = b.dataset.f; draw(); }));
      $('org-q').addEventListener('input', e => { directory.q = e.target.value; draw(); });
      draw();
    }

    async function showOrgDetail(orgId) {
      openDrawer('Organization', '', skeleton([[12, 140], [12, 300]]));
      const { data, error } = await sb.rpc('platform_admin_get_organization', { p_org_id: orgId });
      if (error || !data) { $('drawer-body').innerHTML = errorCard('this organization'); return; }
      $('drawer-title').textContent = data.name;
      $('drawer-sub').textContent = `Created ${new Date(data.created_at).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' })}${data.owner_name ? ` by ${data.owner_name}` : ''}`;
      const p = pct(data.registered_member_count, data.member_count);
      $('drawer-body').innerHTML = `
        <div class="stats">
          <div class="card stat"><div class="lbl">Members</div><b>${fmtInt(data.member_count)}</b><div class="s">${fmtInt(data.registered_member_count)} signed up (${p}%)</div></div>
          <div class="card stat"><div class="lbl">Branches</div><b>${fmtInt(data.unit_count)}</b><div class="s">Units in this organization</div></div>
        </div>
        <section class="card">
          <div class="kv"><span>Status</span><b><span class="badge ${data.is_active ? 'good' : 'neutral'}">${data.is_active ? 'Active' : 'Quiet'}</span></b></div>
          <div class="kv"><span>Last activity</span><b>${esc(ago(data.last_activity_at))}</b></div>
          <div class="kv"><span>Record status</span><b>${esc(data.status || '') || NIL}</b></div>
          <div class="kv"><span>Owner</span><b>${esc(data.owner_name || '') || NIL}</b></div>
        </section>
        <section class="card">
          <div class="lbl">Recent activity</div>
          ${(data.recent_activity || []).length === 0 ? emptyState('No activity recorded', '') : data.recent_activity.map(a => actRow(a, false)).join('')}
        </section>`;
    }

    // ---------- activity ----------
    function renderActivity() {
      const el = $('panel-activity');
      const rows = state.overview?.recent_activity || [];
      if (rows.length === 0) { el.innerHTML = `<section class="card">${emptyState('No activity yet', 'Actions from organizations show up here.')}</section>`; return; }
      const groups = [];
      rows.forEach(a => {
        const d = new Date(a.created_at);
        const today = new Date(); const yest = new Date(); yest.setDate(today.getDate() - 1);
        const key = d.toDateString() === today.toDateString() ? 'Today' : d.toDateString() === yest.toDateString() ? 'Yesterday' : d.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
        if (!groups.length || groups[groups.length - 1].key !== key) groups.push({ key, items: [] });
        groups[groups.length - 1].items.push(a);
      });
      el.innerHTML = `<section class="card">
        <div class="lbl">Latest ${fmtInt(rows.length)} actions <span class="aside">Logins aren't counted as activity</span></div>
        ${groups.map(g => `<div class="day-head">${esc(g.key)}</div>${g.items.map(a => actRow(a)).join('')}`).join('')}
      </section>`;
    }

    // ---------- wire-up ----------
    $('login-form').addEventListener('submit', attemptLogin);
    sb.auth.getSession().then(({ data }) => { if (data.session) enterApp(); });
  </script>
</body>
</html>
